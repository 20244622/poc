<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERB &amp; DMP overview</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --card:#f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; --card:#161b22; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 16px; font-size:24px; }
  h2 { font-size:16px; margin:28px 0 8px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .tab { padding:8px 16px; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; background:none;
         color:var(--muted); font:inherit; cursor:pointer; }
  .tab[aria-selected="true"] { color:var(--fg); border-color:var(--line); background:var(--card); font-weight:600; margin-bottom:-1px; }
  .tab:focus-visible { outline:2px solid var(--accent); }
  .desc { max-width:75ch; margin:0 0 8px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; }
  .tile b { display:block; font-size:22px; }
  .tile span { color:var(--muted); font-size:13px; }
  .bar { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .bar .label { width:min(280px,45%); color:var(--muted); font-size:13px; flex:none; }
  .bar .track { flex:1; }
  .bar .fill { display:block; height:16px; background:var(--accent); border-radius:3px; min-width:2px; }
  .bar .val { font-size:13px; width:32px; text-align:right; flex:none; }
  .search { width:100%; box-sizing:border-box; padding:8px 12px; margin-bottom:8px; font:inherit; color:var(--fg);
            background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .search:focus { outline:2px solid var(--accent); border-color:transparent; }
  .note { color:var(--muted); font-size:13px; margin:0 0 8px; }
  .scroll { overflow:auto; border:1px solid var(--line); border-radius:6px; }
  /* row height is fixed so max-height shows exactly N rows (+ sticky header) */
  .scroll.rows10 { max-height:calc(37px * 11); }
  .scroll.rows20 { max-height:calc(37px * 21); }
  table { border-collapse:separate; border-spacing:0; width:100%; }
  th,td { text-align:left; padding:0 10px; height:36px; box-sizing:border-box; border-bottom:1px solid var(--line);
          white-space:nowrap; line-height:36px; }
  td.title { max-width:380px; overflow:hidden; text-overflow:ellipsis; }
  th { position:sticky; top:0; background:var(--card); z-index:1; }
  footer { margin-top:32px; color:var(--muted); font-size:12px; }
  #status { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>ERB &amp; DMP overview</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-erb" data-ds="erb" aria-selected="true">ERB data</button>
    <button class="tab" role="tab" id="tab-dmp" data-ds="dmp" aria-selected="false">DMP data</button>
  </div>

  <p class="desc" id="desc"></p>
  <p id="status">Loading…</p>

  <h2>Overview</h2>
  <div class="tiles" id="tiles"></div>
  <div id="chart"></div>

  <h2>Search</h2>
  <input id="search" class="search" type="search" placeholder="Search any column, e.g. a key, a word from the title, a department…" autocomplete="off">
  <p class="note" id="count"></p>
  <div class="scroll rows10" id="results-wrap" hidden><table id="results"></table></div>

  <h2>All records</h2>
  <div class="scroll rows20"><table id="table"></table></div>

  <footer>Static snapshot pushed one-way from Databricks. Data shown on this page is synthetic.</footer>
</main>
<script>
const DATASETS = {
  erb: {
    csv: "data/erb.csv", label: "ERB", link: "related_dmp",
    desc: "The Ethics Review Board (ERB) reviews research studies that involve human participants, to make sure " +
          "they are carried out in an ethically responsible way. Researchers submit their study as a request in Jira. " +
          "A daily automated process collects these requests from Jira, cleans them up and prepares them for " +
          "reporting, so this page always reflects the situation of the previous day."
  },
  dmp: {
    csv: "data/dmp.csv", label: "DMP", link: "related_erb",
    desc: "A Data Management Plan (DMP) describes how a research project will handle its data: where it is " +
          "stored, how it is shared and how it is kept for the future. Researchers submit their plan as a request " +
          "in Jira. A daily automated process collects these requests from Jira, cleans them up and prepares them " +
          "for reporting, so this page always reflects the situation of the previous day."
  }
};

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  const [head, ...body] = rows.filter(r => r.length > 1 || r[0] !== "");
  return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const state = { ds: "erb", data: {}, query: "" };

function renderInto(table, rows, cols) {
  table.innerHTML = "<thead><tr>" + cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + cols.map(c => `<td${c === "issue_title" ? ' class="title" title="' + esc(r[c]) + '"' : ""}>${esc(r[c])}</td>`).join("") + "</tr>").join("") +
    "</tbody>";
}

function renderOverview(rows) {
  const approved = rows.filter(r => r.is_approved === "True").length;
  const linked = rows.filter(r => r[DATASETS[state.ds].link]).length;
  const tiles = [
    ["Total " + DATASETS[state.ds].label + " issues", rows.length],
    ["Approved", approved],
    ["Approval rate", rows.length ? Math.round(approved / rows.length * 100) + "%" : "–"],
    [state.ds === "erb" ? "Linked to a DMP" : "Linked to an ERB", linked],
  ];
  el("tiles").innerHTML = tiles.map(([k, v]) => `<div class="tile"><b>${v}</b><span>${k}</span></div>`).join("");
  const counts = {};
  rows.forEach(r => counts[r.department] = (counts[r.department] || 0) + 1);
  const max = Math.max(1, ...Object.values(counts));
  el("chart").innerHTML = "<p class='note'>Issues per department</p>" +
    Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      `<div class="bar"><span class="label">${esc(k)}</span><span class="track"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span><span class="val">${v}</span></div>`).join("");
}

function renderSearch(rows, cols) {
  const terms = state.query.toLowerCase().split(/\s+/).filter(Boolean);
  const wrap = el("results-wrap");
  if (!terms.length) { wrap.hidden = true; el("count").textContent = "Type to search; matching rows appear here."; return; }
  const hits = rows.filter(r => { const hay = cols.map(c => r[c]).join(" ").toLowerCase(); return terms.every(t => hay.includes(t)); });
  el("count").textContent = hits.length + (hits.length === 1 ? " row matches" : " rows match") +
    (hits.length > 10 ? " (scroll to see all)" : "");
  wrap.hidden = hits.length === 0;
  renderInto(el("results"), hits, cols);
}

function render() {
  const d = state.data[state.ds];
  el("desc").textContent = DATASETS[state.ds].desc;
  if (!d) return;
  renderOverview(d.rows); renderSearch(d.rows, d.cols); renderInto(el("table"), d.rows, d.cols);
}

function select(ds) {
  state.ds = ds; state.query = ""; el("search").value = "";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.ds === ds)));
  render();
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => select(t.dataset.ds)));
el("search").addEventListener("input", e => { state.query = e.target.value; const d = state.data[state.ds]; if (d) renderSearch(d.rows, d.cols); });

Promise.all(Object.entries(DATASETS).map(([k, v]) =>
  fetch(v.csv, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(v.csv + " HTTP " + r.status); return r.text(); })
    .then(t => { const rows = parseCSV(t); state.data[k] = { rows, cols: Object.keys(rows[0] || {}) }; })
)).then(() => { el("status").textContent = ""; })
  .catch(e => { el("status").textContent = "Could not load data (" + e.message + ")."; })
  .finally(render);
render();
</script>
</body>
</html>
